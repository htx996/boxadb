# 盒子助手 BoxADB · NAS 部署示例：docker compose up -d
# 群晖 / 威联通 / 极空间 / unRAID 等均可
services:
  boxadb:
    image: boxadb:latest
    container_name: boxadb
    restart: unless-stopped

    # 必须 host 网络：
    # 桥接的 SNAT 会让盒子把 adb 授权记到 docker0 虚拟 IP，而
    # tcpip 5555 同一时刻只容一个来源，于是忽好忽坏的 offline/未授权。
    # host 网络下盒子看到的始终是你真实的局域网 IP。
    network_mode: host

    environment:
      BRIDGE_HOST: 0.0.0.0          # 对外提供服务（桌面版默认仍是 127.0.0.1）
      BRIDGE_PORT: "8765"           # 网页 + 桥（http，会自动把局域网地址请求跳到 https）
      BRIDGE_HTTPS_PORT: "8766"     # 内置自签 https —— 手机/平板靠这个才可用
      BRIDGE_PRIVATE_ONLY: "1"      # 只允许隧道打到私网地址（防被当内网代理）
      BRIDGE_STATE_DIR: /data       # 证书落盘，重启不换证书

    # 证书持久化卷：不挂也能跑，但重启换新证书需重新点「继续访问」
    volumes:
      - boxadb-data:/data

    # 系统不支持 host 网络时退一步用端口映射（来源 IP 会变成网关）：
    # ports:
    #   - "8765:8765"
    #   - "8766:8766"

volumes:
  boxadb-data:

