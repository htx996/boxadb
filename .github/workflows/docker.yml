name: docker-image

# ───────────────────────────────────────────────────────────
# 盒子助手 BoxADB · NAS/Docker 版镜像发布（只手动触发）
#
# 一次构建同时推两个 registry（内容必然一致）：
#   ghcr.io/<作者>/boxadb      GitHub 可追溯来源，无需额外凭据
#   <Docker Hub 用户>/boxadb   NAS 的 Docker 界面默认就是 Docker Hub，且飞牛等自带
#                              镜像加速只镜像 Docker Hub —— 境内靠这份才拉得动
#
# version 填 0.1.0 → 推 0.1.0 / 0.1 / latest；留空 → 只更新 latest。
# 刻意不绑 tag 自动触发：镜像由人确认后再发。
#
# Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Access Token，Read, Write）；
# GHCR 用内置 GITHUB_TOKEN。首次发布后到 Packages → boxadb → Make public，
# 否则匿名拉 ghcr 会 unauthorized（Docker Hub 那份默认公开）。
# ───────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，如 0.1.0（留空 = 只更新 latest）'
        required: false
        default: ''
      push_ghcr:
        description: '是否推 GHCR'
        type: boolean
        required: false
        default: true
      push_hub:
        description: '是否推 Docker Hub'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

# 同一时间只跑一个，避免两个 run 抢着覆盖 latest
concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  # GHCR 要求小写命名空间
  GHCR_IMAGE: ghcr.io/${{ toLower(github.repository_owner) }}/boxadb

jobs:
  image:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # check-dockerfile.sh 要编译 Go，版本从 go.mod 取
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check inputs and secrets
        env:
          VERSION: ${{ inputs.version }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          PUSH_HUB: ${{ inputs.push_hub }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$PUSH_GHCR" != "true" ] && [ "$PUSH_HUB" != "true" ]; then
            echo "::error::GHCR 与 Docker Hub 都没勾选，没有可推送的目标。"
            exit 1
          fi
          if [ "$PUSH_HUB" = "true" ] && { [ -z "$HUB_USER" ] || [ -z "$HUB_TOKEN" ]; }; then
            echo "::error::需要 Docker Hub 的 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
            echo "请到仓库 Settings → Secrets and variables → Actions 添加；或取消勾选「是否推 Docker Hub」只发 GHCR。"
            exit 1
          fi
          # 版本号必须三段 x.y.z
          if [ -n "$VERSION" ]; then
            case "${VERSION#v}" in
              [0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::version 必须是三段 x.y.z（如 0.1.0），收到 '$VERSION'"; exit 1 ;;
            esac
          fi

      # 按 Dockerfile 的 COPY 清单拼上下文再编译，
      # 拦住「漏拷 .go」「COPY 空目录」这类只在真构建才炸的错
      - name: Verify Dockerfile build context
        run: sh scripts/check-dockerfile.sh

      # 交叉架构必需：无 QEMU 就产不出 linux/arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.push_hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 显式算出标签列表，便于核对推了哪些 tag
      - name: Prepare tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          PUSH_HUB: ${{ inputs.push_hub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          V="${VERSION#v}"
          IMAGES=""
          # Actions 用 bash -e 执行，「[ 条件 ] && 赋值」条件为假会让步骤整体失败
          if [ "$PUSH_GHCR" = "true" ]; then
            IMAGES="$GHCR_IMAGE"
          fi
          if [ "$PUSH_HUB" = "true" ]; then
            IMAGES="$IMAGES $DOCKERHUB_USERNAME/boxadb"
          fi
          {
            echo "tags<<TAGS_EOF"
            for IMG in $IMAGES; do
              echo "$IMG:latest"
              if [ -n "$V" ]; then
                echo "$IMG:$V"
                echo "$IMG:$(echo "$V" | cut -d. -f1,2)"     # 0.1.0 → 0.1
              fi
            done
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show what will be pushed
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "本次将推送以下标签："
          printf '  %s\n' $TAGS

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=BoxADB
            org.opencontainers.image.description=网页版 ADB 助手（盒子/电视专用）的 NAS/Docker 版：网页与桥同源，内置自签 https
            org.opencontainers.image.vendor=悟空的日常
            org.opencontainers.image.authors=wukongdaily
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关 attestations：带 provenance/SBOM 的 manifest index 会让部分
          # 老 NAS Docker 界面看不到镜像或报 unknown manifest type
          provenance: false
          sbom: false

      - name: Write summary
        if: success()
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "## 镜像已发布"
            echo ""
            echo '```'
            printf '%s\n' $TAGS
            echo '```'
            echo ""
            echo "NAS 上运行（务必 host 网络，否则 adb 授权会记到 docker0 虚拟 IP）："
            echo ""
            echo '```'
            echo "docker run -d --name boxadb --restart unless-stopped --network host \\"
            echo "  -v boxadb-data:/data \\"
            echo "  <上面任一镜像地址>"
            echo '```'
            echo ""
            echo "打开 https://<NAS 的 IP>:8766/ （首次点「高级 → 继续访问」）"
          } >> "$GITHUB_STEP_SUMMARY"
