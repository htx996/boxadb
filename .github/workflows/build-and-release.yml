name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            suffix: ''
            artifact: boxadb-bridge-darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: ''
            artifact: boxadb-bridge-darwin-amd64
          - goos: windows
            goarch: amd64
            suffix: '.exe'
            artifact: boxadb-bridge-windows-amd64.exe
          - goos: linux
            goarch: amd64
            suffix: ''
            artifact: boxadb-bridge-linux-amd64
          - goos: linux
            goarch: arm64
            suffix: ''
            artifact: boxadb-bridge-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 桌面随包 Node：按矩阵平台取钉死版本（scripts/node-checksums.json），
      # 构建产物里才能启动配对 sidecar（无线调试需要 TLS1.3 外部 PSK，Go 做不了）
      - name: Fetch bundled Node runtime
        run: bash scripts/fetch-node.sh ${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          # Build the package dir (not a single .go file) so Go automatically
          # links the Windows resource object boxadb_windows_amd64.syso
          # (embedded app icon). That file is named *_windows_amd64.syso, so it
          # is included only for windows/amd64 and ignored on the darwin build.
          go build -trimpath -ldflags='-s -w' \
            -o "dist/${{ matrix.artifact }}" .
          ls -la dist/
          file "dist/${{ matrix.artifact }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      # Windows only: bundle exe + icon + installer into a zip so end users get
      # a Mark-of-the-Web-free path (browser barely warns on .zip; install.bat
      # runs Unblock-File). Filename inside zip stays ASCII to avoid Windows
      # codepage issues; the content is UTF-8 Chinese.
      - name: Package Windows zip
        if: matrix.goos == 'windows'
        run: |
          mkdir -p winpkg
          cp dist/boxadb-bridge-windows-amd64.exe winpkg/boxadb-bridge.exe
          cp assets/AppIcon.ico winpkg/AppIcon.ico
          cp install.bat winpkg/install.bat
          cp INSTALL-windows.txt winpkg/README.txt
          ( cd winpkg && zip -r ../dist/boxadb-windows.zip . )
          ls -la dist/
      - name: Upload Windows zip artifact
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: boxadb-windows.zip
          path: dist/boxadb-windows.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: List binaries
        run: ls -la staging/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: boxadb-bridge ${{ steps.tag.outputs.TAG }}
          body: |
            ### 一键命令

            **macOS（Apple Silicon 和 Intel 均支持）** —— 打开 Terminal 粘贴：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/wukongdaily/boxadb/main/install.sh | bash
            ```

            **Windows（10/11 64-bit）** —— 打开 PowerShell 粘贴：
            ```powershell
            iwr https://raw.githubusercontent.com/wukongdaily/boxadb/main/install.bat -o $env:TEMP\install.bat; & $env:TEMP\install.bat
            ```
            （install.bat 会自动拉取本 release 的 `boxadb-windows.zip`、解压、去掉"来自网络"标记，规避 SmartScreen 蓝盾）

            或走图形方式：下载 `boxadb-windows.zip` → 解压 → 双击 `install.bat`。

            **Linux（x86_64 / ARM64）** —— 打开终端粘贴：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/wukongdaily/boxadb/main/install.sh | bash
            ```
            （同一脚本按 `uname` 自动选 `boxadb-bridge-linux-amd64` 或 `boxadb-bridge-linux-arm64`，装到 `~/.local/bin/boxadb-bridge`；Linux 无隔离/签名问题，装完直接 `boxadb-bridge` 运行。）

            **产物说明：** macOS 按 CPU 自动选择 `boxadb-bridge-darwin-arm64`（Apple Silicon）或 `boxadb-bridge-darwin-amd64`（Intel），由 install.sh 处理隔离属性；Linux 提供 `boxadb-bridge-linux-amd64` / `boxadb-bridge-linux-arm64`（静态编译、通用各发行版）；Windows 只发布 `boxadb-windows.zip`（内含 exe + 图标 + 安装脚本），不再单独提供散装 exe。

            ### 怎么用
            1. 双击桌面「BoxADB 桥接」快捷方式 → 弹窗口跑桥（保持别关）
            2. 浏览器打开 https://wukongdaily.github.io/boxadb/ ，填盒子 IP（端口 5555 自动补）→ 点「连接设备」
            3. 用完关掉那个窗口，端口立即释放，不留后台

            构建由 GitHub Actions 完成，二进制无外部依赖。
          files: |
            staging/boxadb-bridge-darwin-arm64
            staging/boxadb-bridge-darwin-amd64
            staging/boxadb-bridge-linux-amd64
            staging/boxadb-bridge-linux-arm64
            staging/boxadb-windows.zip
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
